<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="SlideForge logo: a stylized stack of slides with a spark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- stacked slides -->
  <rect x="30" y="34" width="52" height="38" rx="7" fill="rgba(255,255,255,0.22)"/>
  <rect x="24" y="42" width="52" height="38" rx="7" fill="rgba(255,255,255,0.45)"/>
  <rect x="18" y="50" width="52" height="38" rx="7" fill="rgba(255,255,255,0.95)"/>
  <!-- text lines on front slide -->
  <rect x="28" y="60" width="26" height="5" rx="2.5" fill="url(#bg)"/>
  <rect x="28" y="71" width="32" height="4" rx="2" fill="#9ca3af"/>
  <rect x="28" y="79" width="20" height="4" rx="2" fill="#c4b5fd"/>
  <!-- AI spark -->
  <circle cx="88" cy="30" r="11" fill="#fff"/>
  <path d="M88 21 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" fill="url(#bg)"/>
</svg>
